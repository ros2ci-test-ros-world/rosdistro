# Versions of conda packages for the test Rolling distribution.
#
# The rosdep rules give a key its conda package names. This file gives the
# versions. A conda package that is not listed here is not available, and a
# rosdep key that names it does not resolve on conda.
#
# Most versions here are the ones in the pixi.toml of ros2/ros2, which track
# what Ubuntu 26.04 ships.

# Searched in order.
channels:
- conda-forge

# Always in the environment.
