# rosdep rules for the test rosdistro.
#
# The ubuntu and rhel entries are copied from the rules in ros/rosdistro for
# the same keys, except where a rule named a package that only the ROS package
# repositories carry: those name the distribution's own package, or pip. The
# conda entries are new. Only keys that something in the test workspaces needs
# are here.

pydocstyle:
  conda:
  - pydocstyle
  rhel:
    pip:
      packages:
      - pydocstyle
  ubuntu:
  - pydocstyle
pyflakes3:
  conda:
  - pyflakes
  rhel:
  - python%{python3_pkgversion}-pyflakes
  ubuntu:
  - pyflakes3
