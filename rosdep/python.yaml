# rosdep rules for the test rosdistro.
#
# The ubuntu and rhel entries are copied from the rules in ros/rosdistro for
# the same keys, except where a rule named a package that only the ROS package
# repositories carry: those name the distribution's own package, or pip. The
# conda entries are new. Only keys that something in the test workspaces needs
# are here.

pydocstyle:
  conda:
  - pydocstyle
  rhel:
    pip:
      packages:
      - pydocstyle
  ubuntu:
  - pydocstyle
python3-catkin-pkg-modules:
  conda:
  - catkin_pkg
  rhel:
  - python%{python3_pkgversion}-catkin_pkg
  ubuntu:
  - python3-catkin-pkg
python3-colcon-common-extensions:
  conda:
  - colcon-common-extensions
  rhel:
  - python%{python3_pkgversion}-colcon-common-extensions
  ubuntu:
  - python3-colcon-common-extensions
python3-flake8:
  conda:
  - flake8
  rhel:
    '*':
    - python%{python3_pkgversion}-flake8
    '7': null
  ubuntu:
  - python3-flake8
python3-flake8-blind-except:
  conda:
  - flake8-blind-except
  rhel:
    '*':
    - python3-flake8-blind-except
    '8':
      pip:
        packages:
        - flake8-blind-except
  ubuntu:
    '*':
    - python3-flake8-blind-except
    bionic: null
    focal: null
